name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend tests
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run lint
        working-directory: frontend

  unit-tests:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -m "not security" -q
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test
        working-directory: frontend

  security-tests:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -m security -q
      - run: bandit -r backend/app -ll -q

  docker-build:
    needs: [unit-tests, security-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and smoke test the stack (health checks, all modules, hardening)
        run: scripts/docker_smoke.sh

  dependency-scan:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Audit pinned Python dependencies
        # Three ChromaDB advisories have no fixed release; they concern server auth/RBAC and trust_remote_code
        # embedding models, none of which this lab uses and the Chroma service is never published. See docs/Security_Review.md.
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/constraints.txt --no-deps \
            --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: frontend

  container-scan:
    needs: [unit-tests, security-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lab-backend:ci backend && docker build -t lab-frontend:ci frontend
      - name: Scan images (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lab-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lab-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Dockerfiles and compose (report only; upstream images such as ollama run as root by design)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  build-verification:
    needs: [docker-build, dependency-scan, container-scan]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All gates passed. This workflow never deploys."
