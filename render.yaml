# Render blueprint for the lab API (FastAPI backend).
#
# How to use (beginner friendly steps are in docs/Deployment_Guide.md):
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
#   Then fill in the four `sync: false` environment variables in the service
#   settings after Supabase and Vercel are set up.
services:
  - type: web
    name: owasp-llm-lab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # chromadb==0.5.23 has no wheels for 3.13+, so pin the interpreter.
      - key: PYTHON_VERSION
        value: 3.12.7
      # Frontend origin allowed to call this API (the deployed Render static
      # site, no trailing slash). Add a Vercel URL here if you also host there;
      # the backend always also allows the deployed Render frontend.
      - key: CORS_ORIGINS
        value: https://owasp-llm-lab-web.onrender.com
      # Keeps flags stable across redeploys (Render "Generate value" is fine too).
      - key: LAB_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      # Supabase integration - copy from Supabase -> Settings -> API.
      # Leave unset to run the lab open, without login (local mode).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Real LLM providers (Groq and Gemini are the only ones). There is no
      # engine picker in the UI: the server uses whichever key is present and
      # falls back to the built-in simulator when neither is set.
      # Keys: https://console.groq.com/keys  |  https://aistudio.google.com/apikey
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JUDGE_PROVIDER
        value: auto
