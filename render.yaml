# Render blueprint for the lab API (FastAPI backend).
#
# How to use (beginner friendly steps are in docs/Deployment_Guide.md):
#   Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
#   Then fill in the `sync: false` environment variables in the service
#   settings after Supabase and Vercel are set up.
#
# JWT_SECRET is generated by Render and stays stable across deploys. It is
# required for backend-owned login even when Supabase is configured.
services:
  - type: web
    name: owasp-llm-lab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # chromadb==0.5.23 has no wheels for 3.13+, so pin the interpreter.
      - key: PYTHON_VERSION
        value: 3.12.7
      # Sign and verify the backend's own HttpOnly cookie sessions. Login cannot
      # work without this, even when Supabase is configured.
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_REQUIRED
        value: "1"
      # HTTPS only. Use 0 exclusively for local http:// development.
      - key: COOKIE_SECURE
        value: "1"
      # Frontend origin allowed to call this API and to pass the CSRF Origin
      # check. The deployed Render static site is always allowed; add your
      # Vercel URL (exact origin, no trailing slash) or custom domain here.
      - key: CORS_ORIGINS
        value: https://owasp-llm-lab-web.onrender.com
      # Keeps flags stable across redeploys (Render "Generate value" is fine too).
      - key: LAB_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      # Supabase integration - copy from Supabase -> Settings -> API.
      # Without Supabase the service uses local SQLite (not durable on Render's
      # free filesystem), so production should set these.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional: only for legacy API clients that still send a Supabase bearer
      # token. The web app uses backend-issued cookies instead.
      - key: SUPABASE_JWT_SECRET
        sync: false
      # The administrator's email, used to mirror the role of the matching
      # Supabase account. It does not create a Supabase user by itself.
      - key: ADMIN_EMAIL
        sync: false
      # Local SQLite bootstrap only; ignored when Supabase is configured.
      - key: ADMIN_PASSWORD
        sync: false
      # Real LLM providers (Groq and Gemini are the only ones). There is no
      # engine picker in the UI: the server uses whichever key is present and
      # falls back to the built-in simulator when neither is set.
      # Keys: https://console.groq.com/keys  |  https://aistudio.google.com/apikey
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JUDGE_PROVIDER
        value: auto
