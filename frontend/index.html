<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1114" />
    <meta name="description" content="OWASP LLM Lab is a hands-on security training range for LLM applications: exploit real vulnerabilities, capture flags and validate the fix." />
    <title>OWASP LLM Lab — Hands-on LLM security training</title>
    <script>
      // Resolve the theme before the first paint so there is no flash of the
      // wrong palette. useTheme() re-applies the same value once React mounts.
      ;(function () {
        try {
          var stored = localStorage.getItem('lll.theme')
          var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          var theme = stored === 'light' || stored === 'dark' ? stored : system
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#ffffff' : '#0e1114')
        } catch (error) {
          /* storage blocked: the dark default in the markup stands */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
