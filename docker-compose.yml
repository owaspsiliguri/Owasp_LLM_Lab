# OWASP LLM Learning Lab - local-first stack.  Start with:  docker compose up --build
# Open http://localhost:8080  (bound to 127.0.0.1 only; this is a deliberately vulnerable lab).
name: llm-learning-lab

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [lab]

  backend:
    build: ./backend
    env_file:
      - .env
      - .env.local
    environment:
      CHROMA_URL: http://chromadb:8000
      ANONYMIZED_TELEMETRY: "False"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LAB_DATA_DIR: /data
    # Groq/Gemini keys and model/judge settings come from env_file (.env and
    # .env.local) above, not from here: an `${VAR:-}` line in `environment:`
    # would be resolved from the project .env and blank out the keys.
    volumes:
      - lab_data:/data
    depends_on:
      chromadb:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 6
    networks: [lab]

  # Vector database used by the RAG modules (LLM03, LLM09). Not published to the host.
  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      ANONYMIZED_TELEMETRY: "False"
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [lab]

volumes:
  lab_data:
  chroma_data:

networks:
  lab:
    driver: bridge
